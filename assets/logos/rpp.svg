<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="rppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d10"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rppRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="rppGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#rppBg)" stroke="#334155" stroke-width="2"/>
  <!-- RPP Circle Emblem -->
  <g transform="translate(50, 42)" filter="url(#rppGlow)">
    <circle cx="45" cy="45" r="45" fill="url(#rppRed)"/>
    <!-- Bold RPP Acronym -->
    <text x="45" y="55" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">RPP</text>
  </g>
  <!-- Text Branding -->
  <text x="160" y="85" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">RPP NOTICIAS</text>
  <rect x="160" y="98" width="60" height="4" rx="2" fill="url(#rppRed)"/>
  <text x="160" y="125" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="17" font-weight="700" fill="#94a3b8" letter-spacing="3">SEÑAL DE TELEVISIÓN</text>
  <g transform="translate(50, 165)">
    <rect width="300" height="28" rx="6" fill="#1e293b"/>
    <text x="150" y="19" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle" letter-spacing="1">CONFIANZA EN VIVO LAS 24 HORAS</text>
  </g>
</svg>
