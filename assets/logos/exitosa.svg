<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="exitosaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f05"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="exitosaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="exitosaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#exitosaBg)" stroke="#334155" stroke-width="2"/>
  <!-- Exitosa Microphone / Sound Badge -->
  <g transform="translate(48, 42)" filter="url(#exitosaGlow)">
    <rect width="90" height="90" rx="22" fill="url(#exitosaGold)"/>
    <!-- Mic icon -->
    <rect x="35" y="20" width="20" height="34" rx="10" fill="#1e293b"/>
    <path d="M 27 38 C 27 52 63 52 63 38" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <line x1="45" y1="52" x2="45" y2="68" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <line x1="33" y1="68" x2="57" y2="68" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Text Branding -->
  <text x="155" y="85" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">EXITOSA</text>
  <rect x="155" y="98" width="60" height="4" rx="2" fill="url(#exitosaGold)"/>
  <text x="155" y="125" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="17" font-weight="700" fill="#94a3b8" letter-spacing="3">NOTICIAS Y OPINIÓN</text>
  <g transform="translate(48, 165)">
    <rect width="304" height="28" rx="6" fill="#1e293b"/>
    <text x="152" y="19" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle" letter-spacing="1">LA VOZ DE LOS QUE NO TIENEN VOZ</text>
  </g>
</svg>
