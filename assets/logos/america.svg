<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="americaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="americaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <filter id="americaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff5500" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#americaBg)" stroke="#334155" stroke-width="2"/>
  <!-- Iconic "4" / América Ribbon Emblem -->
  <g transform="translate(50, 42)" filter="url(#americaGlow)">
    <rect width="90" height="90" rx="24" fill="url(#americaOrange)"/>
    <!-- Stylized 4 -->
    <path d="M 64 24 L 32 60 L 72 60 M 56 24 L 56 74" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text Branding -->
  <text x="165" y="85" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="1">américa</text>
  <text x="325" y="65" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="20" font-weight="900" fill="#ff7a00">TV</text>
  <rect x="165" y="98" width="60" height="4" rx="2" fill="url(#americaOrange)"/>
  <text x="165" y="125" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="18" font-weight="700" fill="#94a3b8" letter-spacing="3">CANAL 4 • PRIMERA SEÑAL</text>
  <g transform="translate(50, 165)">
    <rect width="300" height="28" rx="6" fill="#1e293b"/>
    <text x="150" y="19" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle" letter-spacing="1">JUNTÉMONOS MÁS • EN VIVO</text>
  </g>
</svg>
