<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="atvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04240f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="atvGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="atvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#atvBg)" stroke="#334155" stroke-width="2"/>
  <!-- ATV Play Badge -->
  <g transform="translate(48, 42)" filter="url(#atvGlow)">
    <rect width="90" height="90" rx="22" fill="url(#atvGreen)"/>
    <path d="M 36 28 L 66 45 L 36 62 Z" fill="#ffffff"/>
  </g>
  <!-- Text Branding -->
  <text x="155" y="85" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="3">ATV</text>
  <rect x="155" y="98" width="60" height="4" rx="2" fill="url(#atvGreen)"/>
  <text x="155" y="125" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="17" font-weight="700" fill="#94a3b8" letter-spacing="3">TELEVISION</text>
  <g transform="translate(48, 165)">
    <rect width="304" height="28" rx="6" fill="#1e293b"/>
    <text x="152" y="19" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle" letter-spacing="1">ENTRETENIMIENTO Y NOTICIAS</text>
  </g>
</svg>
