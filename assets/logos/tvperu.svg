<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="tvperuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tvperuRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="tvperuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#tvperuBg)" stroke="#334155" stroke-width="2"/>
  <!-- TV Perú Badge -->
  <g transform="translate(50, 42)" filter="url(#tvperuGlow)">
    <rect width="90" height="90" rx="22" fill="url(#tvperuRed)"/>
    <!-- Flag stripes inside badge -->
    <rect x="30" y="10" width="30" height="70" fill="#ffffff" rx="4"/>
    <text x="45" y="54" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="28" font-weight="900" fill="#be123c" text-anchor="middle">7</text>
  </g>
  <!-- Text Branding -->
  <text x="160" y="85" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="1">TV PERÚ</text>
  <rect x="160" y="98" width="60" height="4" rx="2" fill="url(#tvperuRed)"/>
  <text x="160" y="125" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="18" font-weight="700" fill="#94a3b8" letter-spacing="3">CANAL 7 • SEÑAL NACIONAL</text>
  <g transform="translate(50, 165)">
    <rect width="300" height="28" rx="6" fill="#1e293b"/>
    <text x="150" y="19" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="middle" letter-spacing="1">LA SEÑAL DE TODOS LOS PERUANOS</text>
  </g>
</svg>
